# ci — lint, typecheck, unit tests, build (okrdev stack module)
#
# Installs to: .github/workflows/ci.yml
#
# This file is part of the OPTIONAL stack module (Next.js + Vercel + Neon + Drizzle;
# see docs/stack.md). The okrdev method needs none of it — if your repo already has
# CI, keep yours. okr-gate.yml works alongside any CI.
#
# Scope: exactly the checks that should block a merge — lint, typecheck, Vitest,
# build. Playwright smoke tests are deliberately NOT here: they run against the
# Vercel preview URL after it deploys, and Drizzle migrations run against the
# preview's Neon branch in that same flow (see templates/stack/README.md).
#
# Expects these package.json scripts (templates/stack/README.md sets them up):
#   lint, typecheck, test (as `vitest run`, not watch mode), build
#
# The job id is "ci" on purpose: templates/stack/branch-protection.sh registers
# "ci" as the required status check on main. Rename both together or neither.

name: ci

on:
  pull_request:
  push:
    branches: [main]
    # Why run on main too? Deploy = merge, so main must always be green. This run
    # is the tripwire that says so — or says exactly when it stopped being true.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # a new push obsoletes the old run; don't pay for both

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Reads the pnpm version from the "packageManager" field in package.json.
        # create-next-app sets it when you pick pnpm; if it's missing, add e.g.
        #   "packageManager": "pnpm@9.15.0"

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # match your local Node major
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # --frozen-lockfile: CI installs exactly what the lockfile says or fails
        # loudly. A drifted lockfile should break here, not in production.

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build
        # The build should not need real secrets — previews and production get
        # theirs from Vercel. If Next.js insists on an env var at build time, give
        # it a harmless placeholder here rather than a secret:
        # env:
        #   DATABASE_URL: postgres://user:placeholder@localhost:5432/placeholder
